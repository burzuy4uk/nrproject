[[redirects]]
from = "/news/:slug"
to   = "/news-post.html?slug=:slug"
status = 200

[[redirects]]
from = "/news/page/:page"
to   = "/news.html?page=:page"
status = 200

[[redirects]]
from = "/news"
to   = "/news.html"
status = 200

[[redirects]]
from = "/about"
to   = "/about.html"
status = 200

[[redirects]]
from = "/contact"
to   = "/contact.html"
status = 200

[[redirects]]
from = "/*"
to   = "/404.html"
status = 404
