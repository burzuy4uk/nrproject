<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title data-i18n="title">About — Narodna Rada Fond</title>

<body>

        <a href="/" class="brand-link" aria-label="Go to homepage">

        </a>
        <nav class="top-links">
          <a href="#" class="toplink" data-i18n="enc_lex">ENC-LEX ▾</a>

          <a href="#" class="toplink" data-i18n="ukraine_support">Ukraine Support ▾</a>
        </nav>
        <div class="top-actions">
          <a href="#" class="login" data-i18n="login">Login</a>

          <button class="burger" aria-label="Menu" aria-expanded="false"><span class="bar"></span></button>

    <div class="subbar">

      </div>
    </div>

  <div class="menu-overlay" aria-hidden="true"></div>

  <main class="container" style="margin:26px auto 40px">
    <h1 data-i18n="about_us_heading">About us</h1>
    <p data-i18n="about_us_text">Короткий текст про фонд…</p>

  <footer class="footer"><div class="container row" data-i18n="footer_copy">© 2025 Narodna Rada Fond — Усі права захищено</div></footer>
  
  <div class="language-switcher">
    <button id="lang-uk" aria-label="Українська">UA</button>

  </div>

  <script src="/js/burger.js" defer></script>
  <script src="/js/language.js" defer></script>
