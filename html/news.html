  <style>
    /* ── Динамічні новини зі Supabase ── */
    .news-dynamic-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 8px;
    }
    @media (max-width: 900px) { .news-dynamic-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 580px) { .news-dynamic-grid { grid-template-columns: 1fr; } }

    .dyn-card {
      background: #fff;
      border: 1px solid #e7eaf6;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 260px;
      text-decoration: none;
      color: inherit;
      transition: transform .16s ease, box-shadow .16s ease;
      cursor: pointer;
      animation: cardIn .4s ease both;
    }
    @keyframes cardIn { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:none } }
    .dyn-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(15,23,42,.10); }

    .dyn-thumb {
      height: 168px;
      background: linear-gradient(135deg, #eef2ff, #dde5ff);
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }
    .dyn-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
    .dyn-card:hover .dyn-thumb img { transform: scale(1.04); }
    .dyn-thumb .no-photo {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; color: #b8c4e8;
    }

    .dyn-body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .dyn-date { font-size: 12px; color: #8494b2; font-weight: 500; }
    .dyn-title { font-size: 1rem; font-weight: 800; color: #0b1522; line-height: 1.35; }
    .dyn-excerpt { font-size: 13px; color: #475569; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .dyn-more { margin-top: auto; font-size: 13px; font-weight: 700; color: #223a8f; }

    /* Modal */
    .news-modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(10,14,26,.75);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease;
    }
    .news-modal-overlay.open { opacity: 1; pointer-events: all; }
    .news-modal {
      background: #fff;
      border-radius: 20px;
      max-width: 680px; width: 100%;
      max-height: 88vh; overflow-y: auto;
      box-shadow: 0 24px 60px rgba(0,0,0,.3);
      transform: scale(.96) translateY(16px);
      transition: transform .3s cubic-bezier(.22,.8,.24,1);
    }
    .news-modal-overlay.open .news-modal { transform: none; }
    .modal-img { width: 100%; max-height: 320px; object-fit: cover; display: block; border-radius: 20px 20px 0 0; }
    .modal-body { padding: 24px 28px 32px; }
    .modal-date { font-size: 13px; color: #8494b2; margin-bottom: 8px; }
    .modal-title { font-family: 'Unbounded', sans-serif; font-size: clamp(18px,3vw,24px); font-weight: 900; color: #0b1522; margin-bottom: 16px; line-height: 1.3; }
    .modal-content { font-size: 15px; color: #334155; line-height: 1.75; white-space: pre-wrap; }
    .modal-close {
      position: sticky; top: 16px; float: right; margin: 16px 16px 0 0;
      background: rgba(15,23,42,.08); border: none;
      width: 36px; height: 36px; border-radius: 50%;
      font-size: 18px; cursor: pointer; color: #334155;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .modal-close:hover { background: rgba(15,23,42,.15); }

    /* Skeleton loader */
    .skeleton {
      background: #f1f5f9;
      border: 1px solid #e7eaf6;
      border-radius: 14px;
      min-height: 260px;
      overflow: hidden;
      position: relative;
    }
    .skeleton::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,.7) 50%, transparent 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }

    .news-error {
      grid-column: 1/-1; text-align: center;
      padding: 40px 20px; color: #94a3b8; font-size: 15px;
    }
    .news-error .err-icon { font-size: 36px; margin-bottom: 10px; }

    /* Pagination */
    .dyn-pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 8px; margin-top: 28px;
    }
    .dyn-pagination button {
      padding: 8px 16px; border-radius: 8px; border: 1px solid #e2e8f0;
      background: #fff; color: #334155; font-weight: 600; font-size: 14px;
      cursor: pointer; transition: all .15s;
      font-family: inherit;
    }
    .dyn-pagination button:hover:not(:disabled) { background: #eef2ff; border-color: #c7d2fe; color: #223a8f; }
    .dyn-pagination button.active { background: #223a8f; color: #fff; border-color: #223a8f; }
    .dyn-pagination button:disabled { opacity: .4; cursor: not-allowed; }
  </style>
</head>

  <main class="container" style="margin: 26px auto 60px">
    <h1 class="page-title">Новини</h1>

    <!-- Динамічна секція з Supabase -->
    <div id="newsGrid" class="news-dynamic-grid">
      <!-- Skeleton loaders -->
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>

    <nav class="dyn-pagination" id="pagination" aria-label="Пагінація" style="display:none"></nav>
  </main>

  <!-- Modal -->

    <div class="news-modal" id="modalBox">
      <button class="modal-close" onclick="closeModal()" aria-label="Закрити">✕</button>

      <div class="modal-body">
        <div class="modal-date" id="modalDate"></div>

  <script src="/js/burger.js" defer></script>
  <script src="/assets/header/header.js" defer></script>
  <script src="/js/active-nav.js" defer></script>

  <script>
    const PER_PAGE = 9;
    let allNews = [];
    let currentPage = 1;

    async function fetchNews() {
      try {
        const res = await fetch('/.netlify/functions/get-news');
        if (!res.ok) throw new Error('Помилка завантаження');
        allNews = await res.json();
        renderPage(1);
      } catch (e) {
        document.getElementById('newsGrid').innerHTML = `
          <div class="news-error">
            <div class="err-icon">😕</div>
            Не вдалося завантажити новини. Спробуй пізніше.
          </div>`;
      }
    }

    function renderPage(page) {
      currentPage = page;
      const grid = document.getElementById('newsGrid');
      const start = (page - 1) * PER_PAGE;
      const items = allNews.slice(start, start + PER_PAGE);

      if (!items.length) {
        grid.innerHTML = `<div class="news-error"><div class="err-icon">📭</div>Новин поки немає.</div>`;
        document.getElementById('pagination').style.display = 'none';
        return;
      }

      grid.innerHTML = '';
      items.forEach((n, i) => {
        const card = document.createElement('div');
        card.className = 'dyn-card';
        card.style.animationDelay = `${i * 60}ms`;
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', n.title);

        const date = n.created_at
          ? new Date(n.created_at).toLocaleDateString('uk-UA', {day:'2-digit', month:'long', year:'numeric'})
          : '';
        const excerpt = n.content.length > 120 ? n.content.slice(0, 120) + '...' : n.content;

        card.innerHTML = `
          <div class="dyn-thumb">
            ${n.image_url
              ? `<img src="${n.image_url}" alt="${esc(n.title)}" loading="lazy">`
              : `<div class="no-photo">🗞</div>`}
          </div>
          <div class="dyn-body">
            <div class="dyn-date">${date}</div>
            <div class="dyn-title">${esc(n.title)}</div>
            <div class="dyn-excerpt">${esc(excerpt)}</div>
            <div class="dyn-more">Читати далі →</div>
          </div>`;

        card.addEventListener('click', () => openModal(n));
        card.addEventListener('keydown', e => { if (e.key === 'Enter') openModal(n); });
        grid.appendChild(card);
      });

      renderPagination();
    }

    function renderPagination() {
      const total = Math.ceil(allNews.length / PER_PAGE);
      const nav = document.getElementById('pagination');
      if (total <= 1) { nav.style.display = 'none'; return; }

      nav.style.display = 'flex';
      nav.innerHTML = '';

      const prev = document.createElement('button');
      prev.textContent = '‹ Назад';
      prev.disabled = currentPage === 1;
      prev.onclick = () => { renderPage(currentPage - 1); window.scrollTo({top:0,behavior:'smooth'}); };
      nav.appendChild(prev);

      for (let p = 1; p <= total; p++) {
        const btn = document.createElement('button');
        btn.textContent = p;
        if (p === currentPage) btn.classList.add('active');
        btn.onclick = () => { renderPage(p); window.scrollTo({top:0,behavior:'smooth'}); };
        nav.appendChild(btn);
      }

      const next = document.createElement('button');
      next.textContent = 'Далі ›';
      next.disabled = currentPage === total;
      next.onclick = () => { renderPage(currentPage + 1); window.scrollTo({top:0,behavior:'smooth'}); };
      nav.appendChild(next);
    }

    // ── Modal ──
    function openModal(n) {
      const date = n.created_at
        ? new Date(n.created_at).toLocaleDateString('uk-UA', {day:'2-digit', month:'long', year:'numeric'})
        : '';
      const img = document.getElementById('modalImg');
      if (n.image_url) { img.src = n.image_url; img.style.display = 'block'; }
      else { img.style.display = 'none'; }
      document.getElementById('modalDate').textContent = date;
      document.getElementById('modalTitle').textContent = n.title;
      document.getElementById('modalContent').textContent = n.content;
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modalOverlay') && !e.target.classList.contains('modal-close')) return;
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow = ''; } });

    function esc(s) {
      return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    }

    fetchNews();
  </script>
