<!DOCTYPE html>
<html lang="ук">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>News — Narodna Rada Fond</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/news.css">
</head>
<body>
  <header class="dual-header">
    <div class="topbar">
      <div class="container topbar-row">
        <a href="/" class="brand-link" aria-label="Go to homepage">
          <div class="logo-circle">NR</div>
          <div class="brand-text"><div class="brand-title">Narodna Rada Fond</div><div class="brand-subtitle">National Development Fund</div></div>
        </a>
        <nav class="top-links">
          <a href="#" class="toplink">ENC-LEX ▾</a>
          <a href="#" class="toplink">Publications ▾</a>
          <a href="#" class="toplink">Ukraine Support ▾</a>
        </nav>
        <div class="top-actions">
          <a href="#" class="login">Login</a>
          <button class="icon-btn" aria-label="Search">🔍</button>
          <button class="burger" aria-label="Menu" aria-expanded="false"><span class="bar"></span></button>
        </div>
      </div>
    </div>
    <div class="subbar">
      <div class="container">
        <nav class="sub-links" id="subnav">
          <a class="item link" href="/about">About us</a>
          <a class="item link" href="#">Contracting Parties</a>
          <a class="item link" href="#">Secretariat</a>
          <a class="item link" href="#">ECRB</a>
          <a class="item link" href="#">Topics</a>
          <a class="item link active" href="/news">News</a>
          <a class="item link" href="/contact">Events</a>
        </nav>
      </div>
    </div>
  </header>
  <div class="menu-overlay" aria-hidden="true"></div>

  <main class="container news-page">
    <h1 class="page-title">Energy Community News</h1>

    <section class="filters">
      <div class="filters-row">
        <label><span>Country</span><select id="filter-country"><option value="">All</option></select></label>
        <label><span>Year</span><select id="filter-year"><option value="">All</option></select></label>
        <label><span>Category</span><select id="filter-category"><option value="">All</option></select></label>
        <input id="filter-q" type="search" placeholder="Search news..." class="search-inp" />
        <button id="reset-filters" class="btn filters-reset">Reset</button>
      </div>
    </section>

    <section class="content">
      <div class="list" id="news-list"></div>
      <aside class="sidebar">
        <h3 class="sidebar-title">STAY INFORMED</h3>
        <ul class="sidebar-feed" id="sidebar-feed"></ul>
      </aside>
    </section>

    <nav class="pagination" id="pagination"></nav>
  </main>

  <footer class="footer"><div class="container row">© 2025 Narodna Rada Fond — Усі права захищено</div></footer>

  <script src="/js/burger.js" defer></script>
  <script src="/js/news.js" defer></script>
</body>
</html>
